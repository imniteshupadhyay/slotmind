server.port=8080
spring.application.name=slotmind

# Local secrets (LLM key etc.) live in application-local.properties, which is git-ignored.
# Loaded automatically when present; see application-local.properties.example.
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# SQLite: single writer, so one pooled connection + busy timeout avoids "database is locked"
spring.datasource.url=jdbc:sqlite:slotmind.db?busy_timeout=10000&journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Scheduling strategy used by default: "ai" or "rule" (switchable at runtime via PUT /config/strategy)
slotmind.strategy.active=${SLOTMIND_STRATEGY:ai}

# LLM gateway (OpenAI-compatible). Never commit the key: set LLM_API_KEY in your environment.
slotmind.llm.base-url=${LLM_BASE_URL:https://litellm-qc.zycus.net}
slotmind.llm.api-key=${LLM_API_KEY:}
slotmind.llm.model=${LLM_MODEL:qwen-cursor}
slotmind.llm.product-header=${LLM_PRODUCT:PC1}
slotmind.llm.timeout-seconds=${LLM_TIMEOUT_SECONDS:45}
